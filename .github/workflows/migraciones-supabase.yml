# Aplica las migraciones de supabase/migrations/ al proyecto de producción
# cuando algo entra a `main`.
#
# Por qué existe: hasta ahora el esquema se cambiaba a mano desde el SQL
# editor del dashboard. Eso significa que el repo y la base pueden decir
# cosas distintas sin que nadie se entere, y que el despliegue del front
# depende de que alguien se acuerde de correr el SQL. Con esto, mergear a
# `main` es lo único que hay que hacer.
#
# ⚠️ Esto NO es atómico con el despliegue del front. Vercel empieza a
# construir en el mismo push, así que durante ~1-2 minutos conviven la base
# nueva con el front viejo. El `db push` tarda segundos y el build de Vercel
# minutos, así que en la práctica la base migra primero. Para una migración
# que solo AGREGA cosas eso es inocuo. Para una que ROMPE compatibilidad
# hacia atrás —un `drop column`, un `not null` nuevo, un rename— hay una
# ventana real en la que el front viejo pega contra un esquema que ya no
# entiende. La forma de no tener ventana es partir el cambio en dos
# despliegues (primero agregar y hacer que el código tolere ambos esquemas,
# después borrar), no un YAML.
#
# Se corre en TODO push a `main`, sin filtro de `paths`. Filtrar por
# `supabase/migrations/**` parece más prolijo, pero se equivoca en los
# merges: si el archivo entró en un commit anterior del mismo push, el
# filtro no lo ve y la migración nunca se aplica. `db push` es idempotente
# —consulta el historial remoto y no reaplica nada— así que correrlo de más
# no cuesta nada y correrlo de menos sí.

name: Migraciones Supabase

on:
  push:
    branches:
      - main
  # En los PRs a `main` corre en seco: muestra en el check qué migraciones
  # se aplicarían al mergear, para que no haya sorpresas sobre producción.
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Nunca dos migraciones a la vez sobre la misma base, y `cancel-in-progress`
# en false a propósito: cancelar un `db push` a la mitad deja el historial
# de migraciones del remoto en un estado que hay que arreglar a mano.
concurrency:
  group: migraciones-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrar:
    name: Aplicar migraciones al proyecto remoto
    runs-on: ubuntu-latest

    env:
      # No es un secreto: el project ref ya está en scripts/gen-db-types.mjs
      # y viaja en la URL pública de la API.
      PROJECT_REF: tvveelfjazwlinhlbcjd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Traer el repo
        uses: actions/checkout@v4

      - name: Instalar el CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          # Fijada a la misma versión que devDependencies en package.json.
          # `latest` haría que el CLI cambie de comportamiento sobre
          # producción sin que nadie haya tocado una línea del repo; cuando
          # se actualice el paquete, actualizar también este número.
          version: 2.109.1

      - name: Enlazar el proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Simular (PRs a main)
        if: github.event_name == 'pull_request'
        run: supabase db push --dry-run

      - name: Aplicar (merge a main)
        if: github.event_name == 'push'
        run: supabase db push
